<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stone_Paper_Scissor game</title>
    <link rel="stylesheet" href="StonePaperScissor.css">
</head>

<body>
    <h1 class="head1">Rock Paper Scissor</h1>
    <div class="divs">
        <div>
            <img src="rock.png" alt="rock" id="rock">
        </div>
        <div>
            <img src="paper.png" alt="paper" id="paper">
        </div>
        <div>
            <img src="scissors.png" alt="scissior" id="scissior">
        </div>

    </div>
    <h2 class="head2">Score:</h2>
    <div class="head3">
        <h3 class="txt1">You</h3>
        <h3 class="txt1">Comp.</h3>
    </div>
    <div class="head4">
        <h4 class="txt1" id="youScore">0</h4>
        <h4 class="txt1" id="compScore">0</h4>
    </div>
    <h3 class="txt1 head3" id="Draw"></h3>
    <center>
        <button class="btn">Reset</button>
    </center>
    <script src="StonePaperScissor.js">
    </script>
</body>

</html>
